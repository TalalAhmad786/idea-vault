# XcodeGen spec — GitHub Actions turns this into IdeaVault.xcodeproj on a Mac runner.
# (If you ever get a Mac: `brew install xcodegen && xcodegen generate`, then open the .xcodeproj.)
name: IdeaVault
options:
  bundleIdPrefix: com.taq
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  IdeaVault:
    type: application
    platform: iOS
    sources:
      - IdeaVault
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taq.ideavault
        PRODUCT_NAME: IdeaVault
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ideas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
