<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ideas</title>
<meta name="description" content="Capture and grow your product ideas so you never forget them.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff9a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#fff7ef; --card:#ffffff; --text:#2b1d16; --text2:#7a6a60; --text3:#b8a99f;
  --sep:#f1e3d6; --fill:#f8ece0; --input:#fffcf8;
  --accent:#ff7a2f; --pink:#ff4d8d;
  --grad:linear-gradient(135deg,#ffb347 0%,#ff7a2f 48%,#ff4d8d 100%);
  --violet:#7c5cff; --blue:#2e8bff; --orange:#ff8a00; --green:#17a864; --gray:#9a8f88; --red:#ff3b55;
  --shadow:0 2px 12px rgba(120,60,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:17px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  min-height:100vh; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
input,textarea,.d-text{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body.locked{overflow:hidden}
body.sheet-open{background:#1a1008}
#page{background:var(--bg);transition:transform .38s cubic-bezier(.2,.8,.2,1),border-radius .38s,filter .38s;min-height:100vh}
body.sheet-open #page{transform:scale(.92);border-radius:18px;overflow:hidden;filter:brightness(.92)}
body.sheet-open .fab{transform:translate(-50%,140px)}

/* ---------- swipe rows (iOS style) ---------- */
.swipe{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.swipe .card{box-shadow:none;transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:pan-y}
.swipe.dragging .card{transition:none}
.sw-right{position:absolute;top:0;bottom:0;right:0;display:flex;visibility:hidden}
.swipe.dragging .sw-right,.swipe.open .sw-right{visibility:visible}
.sw-right button{width:78px;border:0;color:#fff;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.sw-right button svg{width:22px;height:22px}
.sw-pin{background:var(--accent)}
.sw-del{background:var(--red)}
.sw-left{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding-left:22px;color:#fff;font-weight:800;font-size:15px;background:var(--c);opacity:0}
.sw-left svg{width:22px;height:22px}
.swipe.dir-right .sw-left{opacity:1}
.swipe.dir-right .sw-right{visibility:hidden}
.toast.action{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast .undo{border:0;background:none;color:var(--accent);font-weight:800;padding:0}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block;flex:none}
.wrap{max-width:720px;margin:0 auto}

/* ---------- hero ---------- */
.hero{
  position:relative; overflow:hidden; color:#fff; background:var(--grad);
  padding:calc(env(safe-area-inset-top) + 12px) 20px 70px; border-radius:0 0 34px 34px;
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.hero::before{width:220px;height:220px;right:-70px;top:-60px}
.hero::after{width:140px;height:140px;left:-50px;bottom:-60px}
.hero-in{position:relative;z-index:1;max-width:720px;margin:0 auto}
.hero-top{display:flex;align-items:center;gap:8px}
.greet{flex:1;font-size:16px;font-weight:700;opacity:.95}
.round-btn{width:40px;height:40px;border:0;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff}
.round-btn svg{width:21px;height:21px}
.round-btn:active{transform:scale(.92)}
.hero h1{margin:14px 0 18px;font-size:29px;line-height:1.18;font-weight:800;letter-spacing:-.01em;text-wrap:balance;max-width:560px;min-height:2.36em}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.stat b{font-size:18px;font-weight:800}

/* ---------- capture card ---------- */
.capture{
  position:relative; z-index:2; margin:-48px 16px 0; padding:16px;
  background:var(--card); border-radius:26px;
  box-shadow:0 14px 34px rgba(255,110,60,.2),0 2px 6px rgba(0,0,0,.04);
}
.cap-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.prompt-row{display:flex;align-items:flex-start;gap:10px;margin:6px 0 12px}
.prompt{flex:1;font-size:19px;line-height:1.25;font-weight:800;transition:opacity .2s}
.prompt.fade{opacity:0}
.dice{flex:none;width:40px;height:40px;border:0;border-radius:13px;background:var(--fill);font-size:20px;display:grid;place-items:center}
.dice:active{transform:rotate(25deg) scale(.92)}
.cap-input{
  display:block; width:100%; min-height:92px; resize:none; outline:none;
  border:2px solid var(--sep); border-radius:18px; background:var(--input);
  padding:12px 14px; font:inherit; font-size:17px; color:var(--text);
  transition:border-color .2s, box-shadow .2s;
}
.cap-input::placeholder{color:var(--text3)}
.cap-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,122,47,.14)}
.cap-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.ghost{border:0;background:none;color:var(--text2);font-size:15px;font-weight:700;padding:8px 2px;display:flex;align-items:center;gap:6px}
.ghost svg{width:18px;height:18px}
.grad-btn{
  border:0; border-radius:999px; background:var(--grad); color:#fff; font-weight:800;
  padding:12px 22px; display:flex; align-items:center; gap:8px;
  box-shadow:0 8px 18px rgba(255,77,141,.3); transition:opacity .2s, transform .1s;
}
.grad-btn svg{width:18px;height:18px}
.grad-btn:active{transform:scale(.96)}
.grad-btn:disabled{opacity:.45;box-shadow:none}
.nudge{margin:10px 2px 0;font-size:13px;color:var(--text2)}

/* ---------- list ---------- */
.list-head{display:flex;align-items:center;margin:28px 20px 10px}
.list-head h2{flex:1;margin:0;font-size:22px;font-weight:800}
.list-head .count{color:var(--text3);font-weight:700;margin-left:6px}
.icon-btn{width:40px;height:40px;border:0;border-radius:20px;background:var(--card);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-btn svg{width:20px;height:20px}
.search{margin:0 16px 4px;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:44px;color:var(--text3);box-shadow:var(--shadow)}
.search svg{width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--text3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .clear{border:0;background:none;color:var(--text3);padding:4px;display:none}
.search.has .clear{display:block}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chip svg{width:15px;height:15px;color:var(--c)}
.chip .n{color:var(--text3);font-variant-numeric:tabular-nums}
.chip.on{background:var(--c);color:#fff}
.chip.on svg{color:#fff}
.chip.on .n{color:rgba(255,255,255,.85)}

.group-title{margin:18px 20px 8px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.cards{display:flex;flex-direction:column;gap:10px;margin:0 16px}
.card{
  position:relative; display:block; width:100%; text-align:left; border:0; overflow:hidden;
  background:var(--card); border-radius:20px; padding:14px 16px 13px 20px; box-shadow:var(--shadow);
  transition:transform .12s;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card:active{transform:scale(.985)}
.card-top{display:flex;align-items:flex-start;gap:6px}
.card-title{flex:1;min-width:0;font-weight:800;font-size:17px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-desc{margin-top:3px;font-size:15px;color:var(--text2);word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text2);min-width:0}
.card-meta .cat{display:inline-flex;align-items:center;gap:3px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.card-meta .cat svg{width:12px;height:12px}
.card-meta .time{margin-left:auto;color:var(--text3);white-space:nowrap;font-weight:600}
.next-hint{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent)}
.next-hint svg{width:15px;height:15px}
.pin{color:var(--accent);padding-top:3px}
.pin svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill svg{width:12px;height:12px}
.flames{display:inline-flex;color:var(--red);padding-top:4px}
.flames svg{width:13px;height:13px}

.empty{text-align:center;padding:30px 32px 10px;color:var(--text2)}
.empty .emoji{font-size:54px;line-height:1;margin-bottom:10px}
.empty h3{margin:0 0 6px;color:var(--text);font-size:21px;font-weight:800}
.empty p{margin:0 auto;max-width:300px;font-size:15px}

.banner{margin:14px 16px 0;background:var(--card);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:var(--shadow)}
.banner img{width:42px;height:42px;border-radius:10px}
.banner b{display:block;font-size:15px}
.banner .x{border:0;background:none;color:var(--text3);padding:6px;margin-left:auto}
.banner .x svg{width:18px;height:18px}
.share-ico{display:inline-block;vertical-align:-3px;width:16px;height:16px;color:var(--blue)}

.fab{
  position:fixed; left:50%; z-index:4; bottom:calc(env(safe-area-inset-bottom) + 16px);
  transform:translate(-50%,120px); transition:transform .3s cubic-bezier(.2,.8,.2,1);
  display:flex; align-items:center; gap:8px; border:0; border-radius:999px;
  padding:14px 24px; background:var(--grad); color:#fff; font-weight:800;
  box-shadow:0 10px 26px rgba(255,77,141,.38);
}
.fab.show{transform:translate(-50%,0)}
.fab svg{width:20px;height:20px}
main{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(60,30,10,.32);opacity:0;transition:opacity .28s;z-index:20}
.backdrop.show{opacity:1}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:21; max-width:720px; margin:0 auto;
  height:calc(100% - env(safe-area-inset-top) - 18px);
  background:var(--bg); border-radius:26px 26px 0 0;
  transform:translateY(105%); transition:transform .34s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column; overflow:hidden;
}
.sheet.short{height:auto;max-height:calc(100% - env(safe-area-inset-top) - 18px)}
.sheet.show{transform:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--text3);opacity:.6;margin:7px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;padding:4px 8px 8px;flex:none}
.sheet-head .t{flex:1;text-align:center;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt-btn{border:0;background:none;color:var(--accent);font-size:17px;font-weight:600;padding:8px 10px;min-width:82px}
.txt-btn.l{text-align:left}
.txt-btn.r{text-align:right}
.txt-btn.strong{font-weight:800}
.txt-btn:disabled{color:var(--text3)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}

.section-h{margin:22px 24px 8px;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text2)}
.group{margin:0 16px;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.group.pad{padding:16px}
.foot{margin:8px 24px 0;font-size:13px;color:var(--text2)}
.field{position:relative;padding:12px 16px}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.field textarea,.field input[type=text]{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--text);outline:none;resize:none;padding:0;-webkit-appearance:none;appearance:none}
.field textarea::placeholder,.field input::placeholder{color:var(--text3)}
.field textarea.big{font-size:21px;font-weight:800}
.field.inline{display:flex;align-items:center;gap:12px}
.field.inline label{flex:1;font-weight:600}

.status-grid{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin:0 16px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:700;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 5px rgba(120,60,20,.15)}

.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:31px;background:#e9dccf;transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}

.d-title{margin:0 0 10px;font-size:25px;line-height:1.2;font-weight:800;word-break:break-word}
.d-meta{display:flex;align-items:center;gap:8px}
.d-meta .flames,.d-meta .pin{padding-top:0}
.d-text{margin:12px 0 0;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.next{display:flex;gap:10px;align-items:flex-start;word-break:break-word;font-weight:600}
.next svg{width:22px;height:22px;color:var(--accent);margin-top:-1px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:14px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent);padding:4px 10px;border-radius:999px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;position:relative}
.kv+.kv::before,.kv+.tags-row::before,.list-btn+.list-btn::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.kv span:last-child{color:var(--text2);text-align:right;font-weight:600}
.tags-row{padding:12px 16px;position:relative}
.list-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;text-align:left;position:relative;color:var(--accent);font-weight:700}
.list-btn:active{background:var(--fill)}
.list-btn svg{width:20px;height:20px}
.list-btn.danger{color:var(--red)}
.list-btn.plain{color:var(--text);font-weight:600}
.list-btn .end{margin-left:auto}
.check{color:var(--accent)}

/* ---------- toast + confetti ---------- */
.toast{
  position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 12px); z-index:50;
  transform:translate(-50%,-24px); opacity:0; pointer-events:none;
  background:#fff; color:var(--text); padding:11px 20px; border-radius:999px;
  font-size:15px; font-weight:800; box-shadow:0 10px 30px rgba(120,60,20,.22);
  transition:opacity .25s, transform .25s; white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="page">
<header class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <div class="greet" id="greet"></div>
      <button class="round-btn" id="settingsBtn" aria-label="Settings"></button>
    </div>
    <h1 id="motto"></h1>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <section class="capture" id="capture" aria-label="Capture a new idea">
    <div class="cap-label">✨ Spark of the moment</div>
    <div class="prompt-row">
      <div class="prompt" id="prompt"></div>
      <button class="dice" id="dice" aria-label="Show another question">🎲</button>
    </div>
    <textarea class="cap-input" id="capInput" rows="3" placeholder="Type your idea… even half an idea counts" enterkeyhint="done"></textarea>
    <div class="cap-actions">
      <button class="ghost" id="moreBtn" type="button"></button>
      <button class="grad-btn" id="capBtn" type="button" disabled></button>
    </div>
    <div class="nudge" id="nudge"></div>
  </section>

  <div id="banner"></div>

  <div class="list-head" id="listHead">
    <h2>Your ideas<span class="count" id="countLbl"></span></h2>
    <button class="icon-btn" id="sortBtn" aria-label="Sort"></button>
  </div>
  <div id="controls">
    <label class="search" id="searchBox">
      <span id="searchIco"></span>
      <span class="sr">Search</span>
      <input id="search" type="search" placeholder="Search ideas, tags, notes" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clearSearch" type="button" aria-label="Clear search"></button>
    </label>
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"></div>
</main>
</div>

<button class="fab" id="fab"></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const KEY = 'ideas.v1';
const SORT_KEY = 'ideas.sort';
const BANNER_KEY = 'ideas.bannerDismissed';
const VERSION = '2.0.0';

const ICON = {
  bulb: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.74V17h8v-2.26A7 7 0 0 0 12 2z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  hammer: '<path d="m15 12-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25a2 2 0 0 1-.6-1.42V7.86L16.5 5.3a5.5 5.5 0 0 0-4-1.66H9.44l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/>',
  send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>',
  pause: '<circle cx="12" cy="12" r="10"/><path d="M10 15V9"/><path d="M14 15V9"/>',

function parseTags(text) {
  const seen = new Set(); const out = [];
  for (let t of String(text).split(',')) {
    t = t.trim().replace(/^#+/, '').trim();
    if (t && !seen.has(t.toLowerCase())) { seen.add(t.toLowerCase()); out.push(t); }
  }
  return out;
}
function rel(when) {
  const d = new Date(when); const s = (Date.now() - d) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 172800) return 'yesterday';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  const opts = { month: 'short', day: 'numeric' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
}

/* ================= confetti ================= */
function confetti(x, y) {
  if (reduceMotion) return;
  const c = $('#confetti'); const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const colors = ['#ff7a2f', '#ff4d8d', '#ffb347', '#7c5cff', '#2e8bff', '#17a864', '#ffd23f'];
  const parts = Array.from({ length: 110 }, () => ({
    x, y, vx: (Math.random() - 0.5) * 11, vy: -Math.random() * 12 - 4,
    w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, r: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.4, color: colors[(Math.random() * colors.length) | 0],
  }));
  const start = performance.now();
  (function frame(t) {
    const el = t - start;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 1700);
      ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (el < 1700) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(start);
}
function celebrate(fromEl) {
  const r = fromEl ? fromEl.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 3, width: 0, height: 0 };
  confetti(r.left + r.width / 2, r.top + r.height / 2);
  toast(`${pick(CHEERS)}  Idea #${ideas.length}`);
}

function normalize(r) {
  r = r || {};
  const p = Math.min(3, Math.max(0, parseInt(r.priority, 10) || 0));
  return {
    uuid: String(r.uuid || makeId()).toUpperCase(),
    title: String(r.title ?? ''), details: String(r.details ?? ''),
    problem: String(r.problem ?? ''), nextStep: String(r.nextStep ?? ''),
    category: String(r.category ?? ''),
    tags: Array.isArray(r.tags) ? r.tags.map(String).filter(Boolean) : [],
    status: ORDER.includes(r.status) ? r.status : 'idea',
    priority: p, isPinned: !!r.isPinned,
    createdAt: validDate(r.createdAt || Date.now()), updatedAt: validDate(r.updatedAt || Date.now()),
  };
}
function load() {
  try { const raw = JSON.parse(lsGet(KEY) || '[]'); return Array.isArray(raw) ? raw.map(normalize) : []; }
  catch { return []; }
}
function save() { if (!lsSet(KEY, JSON.stringify(ideas))) toast('⚠️ Could not save, storage is full or blocked'); }

function streak() {
  const days = new Set(ideas.map((i) => dayKey(i.createdAt)));
  const d = new Date(); let n = 0;
  const today = days.has(dayKey(d));
  if (!today) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return { n, today };
}

function visibleIdeas() {
  const q = ui.search.trim().toLowerCase();
  const list = ideas.filter((i) => (!ui.filter || i.status === ui.filter) && (!q || searchText(i).includes(q)));
  const by = {
    updated: (a, b) => b.updatedAt.localeCompare(a.updatedAt),
    created: (a, b) => b.createdAt.localeCompare(a.createdAt),
    priority: (a, b) => b.priority - a.priority || b.updatedAt.localeCompare(a.updatedAt),
    title: (a, b) => displayTitle(a).localeCompare(displayTitle(b), undefined, { sensitivity: 'base' }),
  };
  return list.sort(by[ui.sort] || by.updated);
}

/* ================= sheets ================= */
const stack = [];
function openSheet(inner, short = false, onClose = null) {
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const sh = document.createElement('div'); sh.className = 'sheet' + (short ? ' short' : '');
  sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = '<div class="grabber"></div>' + inner;
  if (!stack.length) {
    // iOS "card stack": shrink the page around the middle of what's on screen
    $('#page').style.transformOrigin = `50% ${scrollY + innerHeight / 2}px`;
  }
  document.body.append(bd, sh);
  const layer = { bd, sh, onClose };
  stack.push(layer);
  bd.addEventListener('click', closeSheet);
  enableSwipeDown(layer);
  void sh.offsetHeight;
  bd.classList.add('show'); sh.classList.add('show');
  document.body.classList.add('locked', 'sheet-open');
  return sh;
}
function closeSheet() {
  const l = stack.pop(); if (!l) return;
  if (document.activeElement && l.sh.contains(document.activeElement)) document.activeElement.blur();
  l.bd.style.opacity = '';
  l.bd.classList.remove('show'); l.sh.classList.remove('show');
  setTimeout(() => { l.bd.remove(); l.sh.remove(); }, 340);
  if (!stack.length) document.body.classList.remove('locked', 'sheet-open');
  if (l.onClose) l.onClose();
}

// Drag a sheet down to dismiss it, like native iOS sheets.
function enableSwipeDown(layer) {
  const { sh, bd } = layer;
  let startY = 0, startT = 0, dy = 0, state = 'idle', body = null;
  sh.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1 || stack[stack.length - 1] !== layer) return;
    body = sh.querySelector('.sheet-body');
    const onHandle = !!e.target.closest('.grabber, .sheet-head');
    if (!onHandle && body && body.scrollTop > 0) return; // let the content scroll first
    startY = e.touches[0].clientY; startT = Date.now(); dy = 0; state = 'pending';
  }, { passive: true });
  sh.addEventListener('touchmove', (e) => {
    if (state === 'idle') return;
    dy = e.touches[0].clientY - startY;
    if (state === 'pending') {
      if (Math.abs(dy) < 8) return;
      if (dy < 0) { state = 'idle'; return; } // pulling up = normal scroll
      state = 'drag';
      sh.style.transition = 'none'; bd.style.transition = 'none';
      if (document.activeElement && sh.contains(document.activeElement)) document.activeElement.blur();
    }
    e.preventDefault();
    const y = Math.max(0, dy);
    sh.style.transform = `translateY(${y}px)`;
    bd.style.opacity = String(Math.max(0, 1 - y / sh.offsetHeight));
  }, { passive: false });
  const end = () => {
    if (state !== 'drag') { state = 'idle'; return; }
    state = 'idle';
    sh.style.transition = ''; bd.style.transition = '';
    const velocity = dy / Math.max(1, Date.now() - startT);
    sh.style.transform = '';
    if (dy > sh.offsetHeight * 0.25 || velocity > 0.55) closeSheet();
    else bd.style.opacity = '';
  };
  sh.addEventListener('touchend', end);
  sh.addEventListener('touchcancel', end);
}
const head = (title, left = 'Cancel', right = '') =>
  `<div class="sheet-head"><button class="txt-btn l" data-act="cancel">${left}</button><div class="t">${esc(title)}</div>` +
  (right ? `<button class="txt-btn r strong" data-act="ok">${right}</button>` : '<span class="txt-btn r"></span>') + '</div>';
function autoGrow(root) {
  root.querySelectorAll('textarea').forEach((t) => {
    const fit = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
    t.addEventListener('input', fit); requestAnimationFrame(fit);
  });
}

/* ---------- editor (new / edit) ---------- */
function openEditor(id, preset = {}) {
  const ex = id ? find(id) : null;
  const d = ex ? { ...ex, tags: [...ex.tags] } : normalize(preset);
  const cats = [...new Set(ideas.map((i) => i.category.trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const sh = openSheet(head(ex ? 'Edit Idea' : 'New Idea', 'Cancel', 'Save') + `<div class="sheet-body">
    <h3 class="section-h">💡 The idea</h3>
    <div class="group">
      <div class="field"><textarea id="e-title" class="big" rows="1" placeholder="Give it a name">${esc(d.title)}</textarea></div>
      <div class="field"><textarea id="e-details" rows="3" placeholder="Describe it: what does it do?">${esc(d.details)}</textarea></div>
    </div>
    <h3 class="section-h">🎯 Problem it solves</h3>
    <div class="group"><div class="field"><textarea id="e-problem" rows="2" placeholder="Who has this problem? Why does it matter?">${esc(d.problem)}</textarea></div></div>
    <h3 class="section-h">👣 Next step</h3>
    <div class="group"><div class="field"><textarea id="e-next" rows="1" placeholder="e.g. Sketch the main screen">${esc(d.nextStep)}</textarea></div></div>
    <p class="foot">One small, concrete action makes it much easier to actually start.</p>
    <h3 class="section-h">📈 Status</h3>
    <div class="status-grid" id="e-status">${ORDER.map((s) => `<button class="chip${d.status === s ? ' on' : ''}" style="--c:${STATUS[s].c}" data-status="${s}">${svg(STATUS[s].i)}${STATUS[s].t}</button>`).join('')}</div>
    <h3 class="section-h">🔥 Priority</h3>
    <div class="seg" id="e-priority">${PRIORITY.map((p, n) => `<button class="${d.priority === n ? 'on' : ''}" data-p="${n}">${p}</button>`).join('')}</div>
    <div class="group" style="margin-top:16px">
      <div class="field inline"><label for="e-pin">📌 Pin to top</label><span class="switch"><input type="checkbox" id="e-pin" ${d.isPinned ? 'checked' : ''}><span></span></span></div>
    </div>
    <h3 class="section-h">🗂 Organize</h3>
    <div class="group">
      <div class="field"><input type="text" id="e-cat" list="e-cats" placeholder="Category (e.g. SaaS, Mobile, AI)" value="${esc(d.category)}" autocomplete="off"></div>
      <div class="field"><input type="text" id="e-tags" placeholder="Tags, separated by commas" value="${esc(d.tags.join(', '))}" autocapitalize="none" autocomplete="off"></div>
    </div>
    <datalist id="e-cats">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>
  </div>`);
  autoGrow(sh);
  const ok = $('[data-act=ok]', sh), title = $('#e-title', sh);
  const sync = () => { ok.disabled = !title.value.trim(); };
  sync(); title.addEventListener('input', sync);
  sh.addEventListener('click', (e) => {
    const st = e.target.closest('[data-status]');
    if (st) { d.status = st.dataset.status; sh.querySelectorAll('[data-status]').forEach((b) => b.classList.toggle('on', b === st)); return; }
    const pr = e.target.closest('[data-p]');
    if (pr) { d.priority = +pr.dataset.p; sh.querySelectorAll('[data-p]').forEach((b) => b.classList.toggle('on', b === pr)); }
  });
  $('[data-act=cancel]', sh).onclick = closeSheet;
  ok.onclick = () => {
    if (!title.value.trim()) return;
    const target = ex || d;
    const wasShipped = ex && ex.status === 'shipped';
    Object.assign(target, {
      title: title.value.trim(),
      details: $('#e-details', sh).value.trim(),
      problem: $('#e-problem', sh).value.trim(),
      nextStep: $('#e-next', sh).value.trim(),
      category: $('#e-cat', sh).value.trim(),
      tags: parseTags($('#e-tags', sh).value),
      status: d.status, priority: d.priority,
      isPinned: $('#e-pin', sh).checked,
    });
    touch(target);
    if (!ex) ideas.push(target);
    save(); render(); closeSheet(); refreshDetail();
    if (!ex) { $('#capInput').value = ''; syncCapture(); celebrate(null); setPrompt(pick(PROMPTS, ui.prompt)); }
    else if (target.status === 'shipped' && !wasShipped) { confetti(innerWidth / 2, innerHeight / 3); toast('You shipped it! 🚀🎉'); }
    else toast('Saved ✓');
  };
  if (!ex) title.focus();
}

/* ---------- detail ---------- */
let detail = null;
function openDetail(id) {
  const sh = openSheet(`<div class="sheet-head"><button class="txt-btn l" data-act="cancel">Done</button><div class="t"></div><button class="txt-btn r strong" data-act="edit">Edit</button></div><div class="sheet-body" id="d-body"></div>`, false, () => { detail = null; });
  detail = { id, sh };
  paintDetail();
  sh.addEventListener('click', (e) => {
    const i = find(detail && detail.id); if (!i) return;
    const st = e.target.closest('[data-status]');
    if (st) {
      const was = i.status; i.status = st.dataset.status; touch(i); save(); render(); paintDetail();
      if (i.status === 'shipped' && was !== 'shipped') { confetti(innerWidth / 2, innerHeight / 3); toast('You shipped it! 🚀🎉'); }
      return;
    }
    const pr = e.target.closest('[data-p]');
    if (pr) { i.priority = +pr.dataset.p; touch(i); save(); render(); paintDetail(); return; }
    const act = e.target.closest('[data-act]'); if (!act) return;
    switch (act.dataset.act) {
      case 'cancel': closeSheet(); break;
      case 'edit': openEditor(i.uuid); break;
      case 'pin': i.isPinned = !i.isPinned; save(); render(); paintDetail(); toast(i.isPinned ? '📌 Pinned' : 'Unpinned'); break;
      case 'delete':
        if (act.dataset.armed) {
          closeSheet(); deleteIdea(i.uuid);
        } else {
          act.dataset.armed = '1';
          act.querySelector('.lbl').textContent = 'Tap again to delete';
          setTimeout(() => { if (act.isConnected) { delete act.dataset.armed; act.querySelector('.lbl').textContent = 'Delete Idea'; } }, 3000);
        }
        break;
    }
  });
}
function refreshDetail() { if (detail) paintDetail(); }
function paintDetail() {
  const i = find(detail.id);
  const body = $('#d-body', detail.sh);
  if (!i) { detail = null; closeSheet(); return; }
  body.innerHTML = `
    <div class="group pad" style="margin-top:8px">
      <h2 class="d-title">${esc(displayTitle(i))}</h2>
      <div class="d-meta">${pill(i.status)}${flames(i.priority)}${i.isPinned ? pinMark() : ''}</div>
      ${i.details ? `<p class="d-text">${esc(i.details)}</p>` : ''}
    </div>
    ${i.problem ? `<h3 class="section-h">🎯 Problem it solves</h3><div class="group pad"><div class="d-text" style="margin:0">${esc(i.problem)}</div></div>` : ''}
    <h3 class="section-h">👣 Next step</h3>
    ${i.nextStep
      ? `<div class="group pad"><div class="next">${svg('arrow')}<span class="d-text" style="margin:0">${esc(i.nextStep)}</span></div></div>`
      : `<div class="group"><button class="list-btn" data-act="edit">${svg('plus')}Add a next step to get it moving</button></div>`}
    <h3 class="section-h">📈 Status</h3>
    <div class="status-grid">${ORDER.map((s) => `<button class="chip${i.status === s ? ' on' : ''}" style="--c:${STATUS[s].c}" data-status="${s}">${svg(STATUS[s].i)}${STATUS[s].t}</button>`).join('')}</div>
    <h3 class="section-h">🔥 Priority</h3>
    <div class="seg">${PRIORITY.map((p, n) => `<button class="${i.priority === n ? 'on' : ''}" data-p="${n}">${p}</button>`).join('')}</div>
    ${(i.category || i.tags.length) ? `<h3 class="section-h">🗂 Organize</h3><div class="group">
      ${i.category ? `<div class="kv"><span>Category</span><span>${esc(i.category)}</span></div>` : ''}
      ${i.tags.length ? `<div class="tags-row"><div class="tags">${i.tags.map((t) => `<span class="tag">#${esc(t)}</span>`).join('')}</div></div>` : ''}
    </div>` : ''}
    <div class="group" style="margin-top:24px">
      <button class="list-btn" data-act="pin">${svg('pin')}<span>${i.isPinned ? 'Unpin' : 'Pin to top'}</span></button>
      <button class="list-btn danger" data-act="delete">${svg('trash')}<span class="lbl">Delete Idea</span></button>
    </div>
    <p class="foot">Created ${esc(fullDate(i.createdAt))} · Updated ${esc(fullDate(i.updatedAt))}</p>`;
}

/* ---------- sort ---------- */
function openSort() {
  const sh = openSheet(head('Sort by', 'Cancel') + `<div class="sheet-body"><div class="group" style="margin-top:8px">
    ${Object.entries(SORTS).map(([k, v]) => `<button class="list-btn plain" data-sort="${k}"><span>${v}</span>${ui.sort === k ? `<span class="end check">${svg('check')}</span>` : ''}</button>`).join('')}
  </div></div>`, true);
  sh.addEventListener('click', (e) => {
    if (e.target.closest('[data-act=cancel]')) return closeSheet();
    const b = e.target.closest('[data-sort]'); if (!b) return;
    ui.sort = b.dataset.sort; lsSet(SORT_KEY, ui.sort); render(); closeSheet();
  });
}

/* ---------- settings / backup ---------- */
async function openSettings() {
  const counts = {}; ideas.forEach((i) => { counts[i.status] = (counts[i.status] || 0) + 1; });
  let persisted = null;
  try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch {}
  const sh = openSheet(head('Settings', 'Done') + `<div class="sheet-body">
    <h3 class="section-h">Your ideas</h3>
    <div class="group">
      <div class="kv"><span>Total</span><span>${ideas.length}</span></div>
      ${ORDER.map((s) => `<div class="kv"><span style="display:flex;align-items:center;gap:8px;color:${STATUS[s].c}">${svg(STATUS[s].i).replace('<svg', '<svg width="18" height="18"')}<span style="color:var(--text)">${STATUS[s].t}</span></span><span>${counts[s] || 0}</span></div>`).join('')}
    </div>
    <h3 class="section-h">Backup</h3>
    <div class="group">
      <button class="list-btn" data-act="export" ${ideas.length ? '' : 'disabled style="opacity:.4"'}>${svg('upload')}Export Backup</button>
      <button class="list-btn" data-act="import">${svg('download')}Import Backup</button>
    </div>
    <p class="foot">Export saves all ideas as a file (choose “Save to Files” or iCloud Drive). Do it now and then. Importing merges by idea, so you won't get duplicates.</p>
    <h3 class="section-h">About</h3>
    <div class="group">
      <div class="kv"><span>Installed as app</span><span>${isStandalone() ? 'Yes' : 'No'}</span></div>
      <div class="kv"><span>Storage</span><span>On this device${persisted ? ' (protected)' : ''}</span></div>
      <div class="kv"><span>Version</span><span>${VERSION}</span></div>
    </div>
    ${isStandalone() ? '' : `<p class="foot">To install: open this page in Safari, tap Share, then “Add to Home Screen”. Ideas saved before installing stay in Safari, so export them first and import them in the installed app.</p>`}
  </div>`);
  sh.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]'); if (!act) return;
    if (act.dataset.act === 'cancel') closeSheet();
    if (act.dataset.act === 'export') exportBackup();
    if (act.dataset.act === 'import') $('#importFile').click();
  });
}

async function exportBackup() {
  if (!ideas.length) return;
  const payload = {
    app: 'IdeaVault', version: 1, exportedAt: iso(),
    ideas: ideas.map((i) => ({
      uuid: i.uuid, title: i.title, details: i.details, problem: i.problem, nextStep: i.nextStep,
      category: i.category, tags: i.tags, status: i.status, priority: i.priority, isPinned: i.isPinned,
      createdAt: i.createdAt, updatedAt: i.updatedAt,
    })),
  };
  const json = JSON.stringify(payload, null, 2);
  const name = `ideas-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([json], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Ideas backup' });
      return;
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Backup downloaded');
}

$('#importFile').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const records = Array.isArray(data) ? data : data.ideas;
    if (!Array.isArray(records)) throw new Error('bad file');
    const byId = new Map(ideas.map((i) => [i.uuid, i]));
    let added = 0, updated = 0;
    for (const r of records) {
      const n = normalize(r);
      const cur = byId.get(n.uuid);
      if (!cur) { ideas.push(n); byId.set(n.uuid, n); added++; }
      else if (n.updatedAt > cur.updatedAt) { Object.assign(cur, n); updated++; }
    }
    save(); render();
    toast(`Imported ${added} new, updated ${updated}`);
  } catch {
    toast('⚠️ That file isn’t an Ideas backup');
  }
});

/* ================= wiring ================= */
$('#settingsBtn').innerHTML = svg('gear');
$('#sortBtn').innerHTML = svg('sort');

capInput.addEventListener('input', () => {

$('#chips').addEventListener('click', (e) => {
  const c = e.target.closest('[data-filter]'); if (!c) return;
  const f = c.dataset.filter || null;

});
/* ---------- swipe actions on idea cards ---------- */
const REVEAL = 156; // width of Pin + Delete buttons
let openSwipe = null, suppressClick = false;
function setX(row, x) { row.querySelector('.card').style.transform = x ? `translateX(${x}px)` : ''; }
function closeOpenSwipe() {
  if (!openSwipe) return;
  const r = openSwipe; setX(r, 0); openSwipe = null;
  setTimeout(() => { if (openSwipe !== r) r.classList.remove('open'); }, 300);
}

(() => {
  const list = $('#list');
  let row = null, sx = 0, sy = 0, dx = 0, base = 0, mode = null;
  list.addEventListener('touchstart', (e) => {
    const r = e.target.closest('.swipe');
    if (!r || e.touches.length !== 1 || e.target.closest('.sw-right button')) { row = null; return; }
    if (openSwipe && openSwipe !== r) closeOpenSwipe();
    row = r; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; mode = null;
    base = openSwipe === r ? -REVEAL : 0;
  }, { passive: true });
  list.addEventListener('touchmove', (e) => {
    if (!row) return;
    const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
    if (!mode) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      mode = Math.abs(mx) > Math.abs(my) ? 'h' : 'v';
      if (mode === 'h') row.classList.add('dragging');
    }
    if (mode !== 'h') return;
    e.preventDefault();
    dx = mx;
    let x = base + dx;
    const canRight = !!row.querySelector('.sw-left');
    if (x > 0 && !canRight) x = x * 0.15;                 // rubber band
    if (x < -REVEAL) x = -REVEAL + (x + REVEAL) * 0.25;   // rubber band past buttons
    row.classList.toggle('dir-right', x > 0);
    setX(row, x);
  }, { passive: false });
  const end = () => {
    if (!row) return;
    const r = row; row = null;
    r.classList.remove('dragging');
    if (mode !== 'h') return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 350);
    const x = base + dx;
    if (x > 90 && r.querySelector('.sw-left')) {
      // Swipe right: advance to next stage
      setX(r, 0); openSwipe = null;
      const i = find(r.dataset.id); const nx = i && NEXT[i.status];
      if (nx) {
        setTimeout(() => {
          i.status = nx; touch(i); save(); render();
          if (nx === 'shipped') { confetti(innerWidth / 2, innerHeight / 3); toast('You shipped it! 🚀🎉'); }
          else toast(`Moved to ${STATUS[nx].t} ${nx === 'building' ? '🔨' : '👍'}`);
        }, 200);
      }
    } else if (x < -REVEAL / 2) {
      setX(r, -REVEAL); openSwipe = r; r.classList.add('open');
    } else {
      setX(r, 0); if (openSwipe === r) openSwipe = null;
      setTimeout(() => { r.classList.remove('dir-right'); if (openSwipe !== r) r.classList.remove('open'); }, 280);
    }
  };
  list.addEventListener('touchend', end);
  list.addEventListener('touchcancel', end);
})();

$('#list').addEventListener('click', (e) => {
  if (suppressClick) return;
  const sw = e.target.closest('[data-sw]');
  if (sw) {
    const id = sw.closest('.swipe').dataset.id; openSwipe = null;
    if (sw.dataset.sw === 'delete') deleteIdea(id);
    else { const i = find(id); if (i) { i.isPinned = !i.isPinned; save(); render(); toast(i.isPinned ? '📌 Pinned' : 'Unpinned'); } }
    return;
  }
  const card = e.target.closest('.card'); if (!card) return;
  if (openSwipe) { closeOpenSwipe(); return; }
  openDetail(card.dataset.id);
});
document.addEventListener('touchstart', (e) => { if (openSwipe && !e.target.closest('.swipe')) closeOpenSwipe(); }, { passive: true });
$('#banner').addEventListener('click', (e) => {
  if (e.target.closest('[data-act=dismiss-banner]')) { lsSet(BANNER_KEY, '1'); renderBanner(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && stack.length) closeSheet();
});

// Show the floating "New idea" button once the capture card scrolls out of view
new IntersectionObserver(([en]) => {
  $('#fab').classList.toggle('show', !en.isIntersecting);
}, { threshold: 0 }).observe($('#capture'));

setInterval(() => { if (!stack.length) render(); }, 60000);
window.addEventListener('storage', (e) => { if (e.key === KEY) { ideas = load(); render(); refreshDetail(); } });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !stack.length) { render(); }
});

render();
renderBanner();

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
})();
