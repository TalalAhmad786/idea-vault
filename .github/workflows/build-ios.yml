name: Build iOS app

on:
  push:
    branches: [main]
    # Only rebuild the native app when its own files change (not for PWA edits in docs/).
    paths:
      - 'IdeaVault/**'
      - 'project.yml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project IdeaVault.xcodeproj \
            -scheme IdeaVault \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | grep -E "error:|warning: .*IdeaVault|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/IdeaVault.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IdeaVault.app Payload/
          zip -qry IdeaVault.ipa Payload
          ls -lh IdeaVault.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdeaVault-ipa
          path: IdeaVault.ipa

      - name: Publish to "latest" release (easy download on iPhone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest IdeaVault.ipa \
            --target "${{ github.sha }}" \
            --title "Ideas – latest build (#${{ github.run_number }})" \
            --notes "Unsigned build. Install with SideStore or AltStore using your free Apple ID." \
            --latest
